<div class="fixed top-0 left-0 right-0 z-[999]">
    <div
        class="hidden md:block w-full bg-blue-600 text-white py-[12px] px-5 sm:px-6 md:px-8 lg:px-10 xl:px-12 2xl:px-0">

        <!-- Wrapper -->
        <div class="max-w-[1520px] mx-auto items-center flex flex-wrap justify-between gap-y-1">

            <!-- List 01 -->
            <div class="flex items-center gap-[16px] lg:gap-[24px] flex-wrap min-w-0">

                <!-- Location -->
                <div class="flex items-center gap-[4px] min-w-0">
                    <img src="https://framerusercontent.com/images/Ia2Lsh9rtV1tDQAbdkEB345je0.svg"
                        class="w-[20px] h-[20px] flex-shrink-0" alt="location icon">

                    <a href="https://www.google.com/maps?q=4296+Coplin+Avenue+Phoenix" target="_blank"
                        class="text-[13px] lg:text-[14px] font-[400] tracking-[-0.2px] leading-[25.2px] text-[#fff] hover:underline truncate">
                        4296 Coplin Avenue, Phoenix
                    </a>
                </div>

                <!-- Email -->
                <div class="flex items-center gap-[4px] min-w-0">
                    <img src="https://framerusercontent.com/images/sNytczb1PQlDKbzj6WTplz25uKc.svg"
                        class="w-[20px] h-[20px] flex-shrink-0" alt="email icon">
                    <a href="mailto:zaydoctor@gmail.com"
                        class="text-[13px] lg:text-[14px] font-[400] tracking-[-0.2px] leading-[25.2px] text-[#fff] hover:underline truncate">
                        zaydoctor@gmail.com
                    </a>

                </div>

            </div>

            <!-- List 02 -->
            <div class="flex items-center gap-[6px] flex-shrink-0">

                <!-- Badge Icon -->
                <svg class="w-[20px] h-[20px] text-yellow-300 mt-1 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="7"></circle>
                    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                </svg>

                <p class="text-white/90 text-[13px] lg:text-[14px] font-[400] whitespace-nowrap">
                    Awarded as the best cleaning company in 2024
                </p>

            </div>

        </div>
    </div>
    <!-- MAIN NAVBAR -->
    <div class="bg-white border-b border-gray-100 px-5 sm:px-6 md:px-8 lg:px-10 xl:px-12 2xl:px-0">
        <div class="max-w-[1520px] mx-auto">

            <div class="flex items-center justify-between h-[64px] md:h-[72px]">

                <!-- LEFT: LOGO -->
                <a href="/" class="flex items-center gap-2 sm:gap-3 flex-shrink-0 min-w-0">

                    <!-- Logo Image -->
                    <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png"
                        alt="Fortzahel Woman Group Logo" class="h-8 md:h-9 w-auto object-contain flex-shrink-0" />

                    <!-- Logo Text -->
                    <div class="flex flex-col leading-tight min-w-0">

                        <span class="text-[16px] md:text-[18px] font-semibold text-[#001305] truncate">
                            Fortzahel
                        </span>

                        <span class="text-[10px] md:text-[11px] tracking-[2px] text-gray-500 uppercase truncate">
                            Woman Group
                        </span>

                    </div>

                </a>

                <!-- CENTER: NAV -->
                <nav class="hidden md:flex flex-1 justify-center">
                    <ul class="flex items-center gap-6 lg:gap-8 text-[15px] font-medium text-gray-700">
                        <li><a routerLink="/home" class="hover:text-blue-600 transition">Home</a></li>
                        <li><a routerLink="/about" class="hover:text-blue-600 transition">About</a></li>
                        <li><a routerLink="/service" class="hover:text-blue-600 transition">Services</a></li>
                        <li><a routerLink="/pages" class="hover:text-blue-600 transition">Pages</a></li>
                        <li><a routerLink="/contact" class="hover:text-blue-600 transition">Contact</a></li>
                    </ul>
                </nav>

                <!-- RIGHT: CALL BUTTON -->
                <div class="flex items-center flex-shrink-0">

                    <a href="tel:+255672277653" class="hidden md:inline-flex items-center gap-2 lg:gap-3
                  bg-yellow-400 hover:bg-yellow-300
                  transition
                  text-black px-4 py-2.5 lg:px-5 lg:py-3 rounded-xl font-medium
                  text-[14px] lg:text-[15px]">

                        <!-- Phone Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 lg:w-5 lg:h-5 flex-shrink-0" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

                            <path stroke-linecap="round" stroke-linejoin="round" d="M22 16.92v3a2 2 0 0 1-2.18 2
                  19.79 19.79 0 0 1-8.63-3.07
                  19.5 19.5 0 0 1-6-6
                  19.79 19.79 0 0 1-3.07-8.67
                  A2 2 0 0 1 4.11 2h3
                  a2 2 0 0 1 2 1.72
                  12.84 12.84 0 0 0 .7 2.81
                  2 2 0 0 1-.45 2.11
                  L8.09 9.91
                  a16 16 0 0 0 6 6
                  l1.27-1.27
                  a2 2 0 0 1 2.11-.45
                  12.84 12.84 0 0 0 2.81.7
                  A2 2 0 0 1 22 16.92z" />
                        </svg>

                        <span class="whitespace-nowrap">Call us: +255-672-277-653</span>

                    </a>

                    <!-- Mobile call icon (compact, shows only below md) -->
                    <a href="tel:+255672277653"
                        class="md:hidden flex items-center justify-center w-10 h-10 rounded-lg bg-yellow-400 hover:bg-yellow-300 transition mr-2"
                        aria-label="Call us">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-black" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M22 16.92v3a2 2 0 0 1-2.18 2
                  19.79 19.79 0 0 1-8.63-3.07
                  19.5 19.5 0 0 1-6-6
                  19.79 19.79 0 0 1-3.07-8.67
                  A2 2 0 0 1 4.11 2h3
                  a2 2 0 0 1 2 1.72
                  12.84 12.84 0 0 0 .7 2.81
                  2 2 0 0 1-.45 2.11
                  L8.09 9.91
                  a16 16 0 0 0 6 6
                  l1.27-1.27
                  a2 2 0 0 1 2.11-.45
                  12.84 12.84 0 0 0 2.81.7
                  A2 2 0 0 1 22 16.92z" />
                        </svg>
                    </a>

                    <!-- Mobile Menu Button -->
                    <button type="button"
                        class="md:hidden flex items-center justify-center w-10 h-10 rounded-lg hover:bg-gray-100"
                        (click)="toggleMobileMenu()">

                        <!-- Hamburger -->
                        <svg *ngIf="!mobileMenuOpen" xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>

                        <!-- Close -->
                        <svg *ngIf="mobileMenuOpen" xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>

                    </button>
                </div>

            </div>

        </div>
    </div>
    <!-- Mobile Menu -->

    <div *ngIf="mobileMenuOpen" class="md:hidden bg-white border-b shadow-md max-h-[calc(100svh-64px)] overflow-y-auto">

        <nav class="max-w-[1520px] mx-auto px-5 py-6">

            <ul class="flex flex-col gap-5 text-[16px] font-medium">

                <li>
                    <a routerLink="/home" (click)="closeMobileMenu()" class="block">
                        Home
                    </a>
                </li>

                <li>
                    <a routerLink="/about" (click)="closeMobileMenu()" class="block">
                        About
                    </a>
                </li>

                <li>
                    <a routerLink="/service" (click)="closeMobileMenu()" class="block">
                        Services
                    </a>
                </li>

                <li>
                    <a routerLink="/pages" (click)="closeMobileMenu()" class="block">
                        Pages
                    </a>
                </li>

                <li>
                    <a routerLink="/contact" (click)="closeMobileMenu()" class="block">
                        Contact
                    </a>
                </li>

            </ul>

            <a href="tel:+255672277653"
                class="mt-6 inline-flex w-full justify-center items-center gap-2 bg-yellow-400 text-black py-4 rounded-xl font-medium">

                Call us: +255-672-277-653

            </a>

        </nav>

    </div>
</div>
